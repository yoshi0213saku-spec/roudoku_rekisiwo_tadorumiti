<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>歴史をたどる道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 縦一列の「帖」：目次カード → 本文ページ、下に固定の再生バー */
:root{
  --bg:#eef0ea; --paper:#f8f9f5; --ink:#1f2a33; --sub:#5b6770; --line:#d3d8cf;
  --ai:#24476b; --ai-soft:#dce5ee; --moss:#5d7444; --warn:#9a3b2c;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1f; --paper:#1c242b; --ink:#e4e8e2; --sub:#9aa6ad; --line:#2e3a43;
  --ai:#8fb3d9; --ai-soft:#25364a; --moss:#9fbb7f; --warn:#e08a78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1f; --paper:#1c242b; --ink:#e4e8e2; --sub:#9aa6ad; --line:#2e3a43;
  --ai:#8fb3d9; --ai-soft:#25364a; --moss:#9fbb7f; --warn:#e08a78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 140px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--ai);outline-offset:2px}

header.top{padding-block:16px 18px;display:grid;gap:10px}
.cover{position:relative;margin:0 0 6px;border-radius:14px;overflow:hidden;max-width:100%;aspect-ratio:400/480;max-height:78vh;background:#1b2230}
.cover svg{display:block;width:100%;height:100%}
.cover-title{position:absolute;top:7%;right:9%;margin:0;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:700;font-size:clamp(34px,10vw,50px);letter-spacing:.18em;line-height:1;color:#fbf6ec;text-shadow:0 2px 12px rgba(20,30,50,.55)}
.cover-sub{position:absolute;top:8%;right:calc(9% + clamp(34px,10vw,50px) + 14px);writing-mode:vertical-rl;font-size:13px;letter-spacing:.3em;color:#f2e6d2;text-shadow:0 1px 6px rgba(20,30,50,.6)}
.cover-author{position:absolute;left:5%;bottom:4.5%;font-family:var(--mincho);font-size:clamp(15px,4.2vw,19px);letter-spacing:.2em;color:#fbf6ec;text-shadow:0 1px 8px rgba(10,20,20,.8)}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--moss);font-weight:700}
h1{font-family:var(--mincho);font-size:32px;line-height:1.3;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:0;font-size:15px}
.stats{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px}
.item .no{font-family:var(--mincho);font-size:22px;color:var(--ai);text-align:center;font-variant-numeric:tabular-nums}
.item .t{font-family:var(--mincho);font-size:19px;font-weight:700;line-height:1.35;min-width:0}
.item .meta{font-size:12.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--ai-soft);border-color:transparent;color:var(--ai);font-weight:700}
.item.playing{border-color:var(--ai);box-shadow:inset 4px 0 0 var(--ai)}

/* 本文 */
.end-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:8px 0 24px;padding-top:18px;border-top:1px solid var(--line)}
.end-nav .btn{flex:1 1 auto;justify-content:center}
/* 本文ページの絵：最初は表紙と同じ大きさ、読み進めると上に小さく残る */
.d-cover{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 6px 14px -10px rgba(0,0,0,.45)}
.d-cover svg{display:block;width:100%;height:100%}

.back{background:none;border:0;padding:16px 0 4px;color:var(--ai);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.reading{padding-block:8px 24px}
.reading .season{font-size:13px;color:var(--moss);letter-spacing:.15em;font-weight:700}
.reading h2{font-family:var(--mincho);font-size:30px;line-height:1.35;margin:4px 0 6px;text-wrap:balance}
.reading .len{font-size:13px;color:var(--sub)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;min-height:46px}
.btn.primary{background:var(--ai);color:var(--paper);border-color:var(--ai)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--sub);margin:4px 0 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:8px}
.body{font-family:var(--mincho);font-size:var(--fs,19px);line-height:2.05;margin-top:22px;max-width:34em}
.body p{margin:0 0 1.1em;text-indent:1em}
.sizer{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin-top:14px}
.sizer button{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:40px;height:36px;font-weight:700}

/* 再生バー */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:640px;margin:0 auto;display:grid;gap:6px}
.p-title{font-family:var(--mincho);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row{display:flex;align-items:center;gap:8px}
.p-row input[type=range]{flex:1;min-width:0;accent-color:var(--ai);height:28px}
.time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ic{background:none;border:0;width:40px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center}
.ic svg{width:24px;height:24px;fill:currentColor}
.ic.big{width:56px;height:56px;background:var(--ai);color:var(--paper)}
.ic.big svg{width:28px;height:28px}
.rate{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:52px}
.p-head{display:flex;align-items:center;gap:8px}
.p-head .p-title{flex:1;min-width:0}
.sleep{flex:none}
.rate[aria-pressed="true"]{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.p-empty{font-size:13px;color:var(--sub)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}
</style>
</head>

<script>
const WORKS=[
{id:"r00",title:"はじめに",season:"時代と五つの物語",intro:true,text:[
"これから、「歴史をたどる道」と題して、五つの物語をお届けします。",
"舞台は、今からおよそ四百五十年前、戦国時代の信州です。八ヶ岳の東、千曲川の上流にひろがる、佐久の山あいの谷が、物語の舞台となります。",
"そのころ、となりの甲斐の国を治めていたのが、武田信玄です。若いころは、晴信と名のっていました。天文十六年、西暦一五四七年、信玄の軍勢は佐久の村々へ攻め入り、やがてこのあたりは、武田の領地となりました。",
"永禄四年、一五六一年には、北信濃の川中島で、越後の上杉の軍勢との大きな戦いがありました。信州の村々からも、多くの男たちが戦に出ていきました。",
"元亀四年、一五七三年、信玄が病で亡くなると、息子の勝頼があとを継ぎました。しかし天正十年、一五八二年の春、織田信長の大軍に攻められ、武田家は天目山のふもとで滅びました。",
"これからお聞きいただく物語に登場するのは、名のある武将ではありません。谷に暮らし、田を耕し、家族の帰りを待った、名もない人びとです。物語は、こうした史実をもとにした創作です。",
"第一話「狼煙の上がった日」。武田の軍勢が佐久へ攻め入ったころ、尾根の狼煙場を守る父と、それを見つめる息子の物語です。",
"第二話「峠を越えた手紙」。川中島の戦いに出た夫から、峠を越えて、一通の手紙が届きます。",
"第三話「石を積む人」。山の城の石垣を積む少年と、年老いた石工の物語です。",
"第四話「隠し湯の娘」。谷の奥の湯小屋で、湯守の娘と、傷ついた若い武者が出会います。",
"第五話「谷に残ったもの」。武田家が滅んだという知らせが届いた春、谷の人びとは、何を選んだのでしょうか。",
"それでは、戦国の谷へ、ご案内いたしましょう。"]},
{id:"r01",title:"狼煙の上がった日",season:"天文のころ",text:[
"谷のいちばん高い尾根の上に、石を丸く積んだ台があった。村の人たちは、そこを狼煙場と呼んでいた。わたしの父は、その狼煙場の番をまかされていた。",
"夏のはじめ、甲斐のお屋形さまの軍勢が、佐久の村々へ攻め入ったという話が、谷にも届いていた。そのころから父は、毎晩のように尾根へのぼるようになった。ある夜、わたしはどうしてもついて行きたいとせがんだ。",
"尾根の上は、思ったよりも風が強かった。台のそばには、枯れ枝と、湿らせた青い草と、狼の糞をかわかしたものが積んであった。「これを燃やすと、煙がまっすぐ立つんだ」と父は言った。",
"父は、南の山のいただきを指さした。「あの山で煙が上がったら、こっちも火をつける。すると、北の山でも煙が上がる。そうやって、山から山へ知らせを送るんだ。馬で走るより、ずっと速い」。",
"帰り道、父は、狼煙の上げ方を教えてくれた。昼は煙、夜は火。煙の数や上げる回数で、知らせの中身も変わるのだという。「おまえも大きくなったら、この番をするんだぞ」。わたしは胸をはって、うなずいた。夜空には、星がこぼれるほどに光っていた。",
"わたしは、それから毎日、南の山ばかり見て過ごした。けれど、何日たっても、煙は上がらなかった。父は「上がらないのが、いちばんいいんだ」と言って、笑っていた。",
"秋の気配がしはじめた、ある朝のことだった。畑で草を取っていると、父が鍬を放りだして走りだした。見上げると、南の山のいただきから、ひとすじの白い煙が、まっすぐ空へのびていた。",
"わたしも、息を切らして父のあとを追った。尾根に着くと、父はもう火打ち石を打っていた。枯れ枝に火が移り、青い草をかぶせると、白い煙が、もくもくと立ちのぼった。目にしみて、涙がにじんだ。",

{id:"r02",title:"峠を越えた手紙",season:"永禄のころ",text:[
"夫の与平が、相木の殿さまの軍勢に加わって村を出たのは、田植えが終わってすぐのことだった。行き先は、ずっと北の川中島だという。越後の上杉の軍勢と、また戦になるのだと聞いた。",
"「稲刈りまでには、帰ってくる」。与平はそう言って、わらじのひもを結んだ。わたしは、にぎり飯を三つ包んで持たせた。それしか、してやれることがなかった。",
"村の男たちが出ていったあとの谷は、急にがらんとして見えた。残されたのは、年寄りと、女と、子どもばかりだった。それでも田んぼは待ってくれない。わたしたちは、朝はまだ暗いうちから起きて、男たちのぶんまで働いた。夕方になると、女たちは寺の前に集まって、北の空に向かって手を合わせた。",
"夏のあいだ、わたしは一人で田の草を取り、水を見まわった。夜になると、囲炉裏の火を見つめながら、北の空のことばかり考えた。戦がどうなっているのか、谷にはなかなか知らせが届かなかった。",

"十月のはじめ、峠を越えて、塩売りの男がやって来た。男は、ふところから、折りたたんだ紙を取りだした。「与平さんから、あずかってきた」。紙は雨にぬれて、すみがところどころにじんでいた。",
"わたしは、字が読めなかった。紙を胸にだいて、村はずれのお寺まで走った。和尚さまは、めがねもないのに目を細めて、ゆっくりと読んでくれた。",
"「無事でいる。大きな戦があったが、生きのびた。稲刈りに間に合わず、すまぬ。おまえ一人に苦労をかける。雪が降るまでには、かならず帰る」。",
"和尚さまが読み終えると、わたしは、その場にすわりこんでしまった。涙が、あとからあとからあふれてきた。和尚さまは何も言わず、わたしが泣きやむまで、そばにいてくれた。",
"その夜、わたしは手紙を枕もとに置いて眠った。読めない字を、指でなぞってみた。与平の手のぬくもりが、そこに残っているような気がした。",

{id:"r03",title:"石を積む人",season:"元亀のころ",text:[
"村の裏山の上に、城が築かれることになった。城といっても、天守のある立派なものではない。山の尾根を削り、堀を掘り、まわりを石垣で固めた、小さな山の城だ。",
"十五になったばかりの源太は、石積みの作造じいさんのもとで、その石垣づくりを手伝うことになった。作造じいさんは、背中が曲がっていたけれど、目だけは鷹のように鋭かった。",
"最初の日、源太は、沢から運び上げた石を、ただ言われるままに並べていった。すると、作造じいさんが、黙ってその石をひとつずつ外していった。「石には顔がある。顔を見ないで積んだ石は、すぐに崩れる」。",
"石運びは、つらい仕事だった。沢から尾根まで、背負子に石をくくりつけて、何度も坂をのぼる。肩の皮がむけ、足はがくがくとふるえた。夜、家に帰ると、母が肩に薬をぬってくれた。それでも源太は、一日も休まなかった。",

"このあたりの石垣は、山や沢で拾った自然の石を、そのまま組み合わせて積んでいく。野面積みというやり方だ。形のそろわない石どうしを、うまくかみ合わせなければならない。大きな石のすきまには、小さな石をつめて、全体をしっかりと支える。",
"夏が過ぎ、秋が来るころには、源太にも少しずつ、石の顔が見えるようになってきた。この石は、この面を下にしたがっている。この石は、となりの石と肩を組みたがっている。そう思えるようになったのだ。",
"ある日、作造じいさんは、源太が積んだ一角を、長いあいだ黙って見ていた。そして、ぽつりと言った。「これなら、百年はもつ」。源太は、うれしくて、その夜はなかなか眠れなかった。",

{id:"r04",title:"隠し湯の娘",season:"永禄のころ",text:[
"谷の奥の、さらに奥。沢をさかのぼった岩かげに、湯の湧く場所があった。湯は白い湯気を立てて岩のあいだからあふれ、小さな池をつくっていた。",
"このあたりでは、その湯を、お屋形さまの隠し湯と呼んでいた。戦で傷ついた武者たちが、人目をさけて傷をいやしに来る湯だ、という言い伝えがあった。",
"おきぬの家は、その湯のそばで、小さな湯小屋の番をしていた。おきぬは十三。湯をくみ、薪を割り、湯治に来る人のために、かゆを炊くのが仕事だった。",
"湯治に来るのは、武者ばかりではなかった。腰をいためた木こりや、冬の寒さで手足のしびれた年寄りも、山道を何日もかけてやって来た。湯につかった人たちは、みな「生き返るようだ」と言って、目を細めた。おきぬは、その顔を見るのが好きだった。",
"ある秋の日、肩に深い傷を負った若い武者が、仲間にかつがれてやって来た。甲斐の国から来たという。名を、新三郎といった。新三郎は、熱にうなされて、三日のあいだ目をさまさなかった。",
"おきぬは、母に教わったとおり、薬草をすりつぶして傷にぬり、ぬらした布で額を冷やした。四日目の朝、新三郎はうっすらと目を開けて、「ここは、どこだ」とたずねた。",
"傷がふさがるにつれて、新三郎はよく話をするようになった。甲府の町には、たくさんの店がならび、市の日にはにぎやかな人の声が通りにあふれること。お屋形さまの館のまわりには、深い堀がめぐらされていること。おきぬは、谷から出たことがなかった。新三郎の話は、どれも夢のようだった。",
"「おまえは、この湯のような娘だな」と、新三郎はあるとき言った。「ここにいると、戦のことを忘れてしまう」。おきぬは、何と答えていいかわからず、ただ湯気の向こうでうつむいていた。",
"ひと月がたち、新三郎の肩はすっかりよくなった。迎えの者が来た朝、新三郎は、おきぬに小さな鈴をくれた。「甲府の市で買ったものだ。礼のしるしに」。",
"新三郎は、一度も振り返らずに、沢の道を下りていった。おきぬは、その背中が木々のあいだに見えなくなるまで、湯小屋の前に立っていた。",
"その後、新三郎がどうなったのか、おきぬは知らない。けれど、年をとってからも、おきぬは鈴を肌身はなさず持っていたという。沢の奥の湯は、今も静かに湧きつづけている。風の強い日には、湯気の向こうから、ちりんと鈴の音が聞こえるような気がする。"]},
{id:"r05",title:"谷に残ったもの",season:"天正のころ",text:[
"その知らせが谷に届いたのは、山の雪がとけはじめた、春のことだった。甲斐のお屋形さまの家が、滅びたというのだ。",
"信玄公が亡くなってから、もう九年がたっていた。そのあとを継いだ勝頼さまが、織田の大軍に追われ、天目山のふもとで最期をとげたという。",
"村の人たちは、寺の境内に集まって、顔を見あわせた。「これから、どうなるんだ」「新しい殿さまは、どんな人だ」「また戦になるのか」。不安な声が、あちこちでささやかれた。",
"そのとき、せきばらいをして立ち上がったのは、村でいちばん年寄りの、おせんばあさんだった。おせんばあさんは、もう七十をとうに越えていた。",
"「わしが娘のころ、この谷は、ちがう殿さまのものだった。それが、甲斐のお屋形さまのものになった。そして今度は、また別のだれかのものになる。殿さまは、何度でも変わる」。",
"おせんばあさんは、ゆっくりと境内を見まわした。「けれど、田んぼは待ってくれん。苗代の種まきは、今年もいつもどおりだ。山の雪どけ水も、いつもどおり流れてくる」。",
"「戦は、殿さまたちがすることだ。わしらがすることは、土を耕して、米をつくって、子を育てることだ。それだけは、だれが殿さまになっても変わらん」。おせんばあさんの声は、小さかったけれど、境内のすみずみまで届いた。",
"だれも、何も言わなかった。やがて、ひとり、またひとりと、村の人たちは家へ帰っていった。そして次の朝、いつもの年と同じように、苗代に種をまいた。",
"その年の夏も、田んぼには青々と稲が育った。秋には、黄金色の穂が風にゆれた。谷を治める殿さまは、たしかに変わった。けれど、田んぼの景色は、少しも変わらなかった。",
"おせんばあさんは、その秋の稲刈りを見届けて、静かに息を引きとった。村の人たちは、ばあさんを、田んぼを見わたせる丘の上にほうむった。",
"ばあさんの墓のそばには、だれが植えたのか、一本の山桜が育った。春になると、その桜は、苗代に種をまく村人たちを見下ろすように花を咲かせた。村の人たちは、その桜が咲くと、「おせんばあさんが、種まきを見に来た」と言いあったという。",
"あれから、四百年あまり。城はなくなり、殿さまの名前を覚えている人も、ほとんどいない。それでも、谷には今も田んぼがあり、春には苗代に種がまかれる。この谷に残ったのは、戦の記憶ではなく、土を耕しつづけた人たちの暮らしだったのかもしれない。"]}
];

const $=id=>document.getElementById(id);
const audio=$("audio");
const state={cur:null,view:null,urls:{},src:{},rate:1,cont:true,fs:19};
const RATES=[0.8,1,1.25];
try{const s=JSON.parse(localStorage.getItem("rekishi-prefs")||"{}");Object.assign(state,{rate:s.rate||1,cont:s.cont!==false,fs:s.fs||19});}catch(e){}
function savePrefs(){try{localStorage.setItem("rekishi-prefs",JSON.stringify({rate:state.rate,cont:state.cont,fs:state.fs}))}catch(e){}}

/* --- この端末への保存（IndexedDB） --- */
let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("rekishi-roudoku",1);r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});return dbp;}
async function idbOp(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("audio",mode);const st=tx.objectStore("audio");const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);});}
const idbGet=k=>idbOp("readonly",s=>s.get(k));
const idbPut=(k,v)=>idbOp("readwrite",s=>s.put(v,k));
const idbDel=k=>idbOp("readwrite",s=>s.delete(k));

/* 音声の有無を調べる：ページに公開された audio/rNN.mp3 を優先、なければ端末内 */
/* ページに組みこんだ音声とその長さ（秒） */
const PAGE_AUDIO={};
const ORIG={r00:"0_hajimeni",r01:"1_norosino_agatta_hi",r02:"2_tougewo_koeta_tegami",r03:"3_isiwo_tumu_hito",r04:"4_kakusiyuno_musume",r05:"5_tanini_nokotta_mono"};
async function probe(w){
  /* GitHubに置いたMP3を、いくつかの名前・場所の候補から探す */
  const names=[w.id+".mp3",ORIG[w.id]+".mp3",ORIG[w.id].replace(/^(\d+)\./,"$1_")+".mp3",ORIG[w.id].replace(/^(\d+)_/,"$1.")+".mp3"];
  const cands=[];names.forEach(f=>{cands.push(f,"audio/"+f)});
  for(const u of [...new Set(cands)]){
    try{const r=await fetch(encodeURI(u),{method:"HEAD",cache:"no-store"});if(r.ok){state.urls[w.id]=encodeURI(u);state.src[w.id]="page";return;}}catch(e){}
  }
  try{const b=await idbGet(w.id);if(b){state.urls[w.id]=URL.createObjectURL(b);state.src[w.id]="device";}}catch(e){}
}

function minutes(w){const n=w.text.join("").length;return Math.max(1,Math.round(n/310));}
function fmt(t){if(!isFinite(t))return"0:00";t=Math.floor(t);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
const KAN=["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五"];

function renderList(){
  const ul=$("list");ul.textContent="";
  WORKS.forEach((w,i)=>{
    const li=document.createElement("li");
    const b=document.createElement("button");b.type="button";b.className="item"+(state.cur===w.id&&!audio.paused?" playing":"");
    b.innerHTML='<span class="no"></span><span style="min-width:0"><span class="t"></span><span class="meta"><span class="s"></span><span class="m"></span></span></span><span class="chip"></span>';
    b.querySelector(".no").textContent=w.intro?"序":KAN[WORKS[0].intro?i-1:i];
    b.querySelector(".t").textContent=w.title;
    b.querySelector(".s").textContent=w.season;
    b.querySelector(".m").textContent=PAGE_AUDIO[w.id]?fmt(PAGE_AUDIO[w.id]):"約"+minutes(w)+"分";
    const c=b.querySelector(".chip");const has=!!state.urls[w.id];c.textContent=has?"音声あり":"音声なし";if(has)c.classList.add("on");
    b.onclick=()=>{location.hash=w.id};
    li.appendChild(b);ul.appendChild(li);
  });
  const n=WORKS.filter(w=>state.urls[w.id]).length;
  $("stats").textContent="音声が入っている朗読　"+n+" / "+WORKS.length+" 本";
}

function renderDetail(){
  const w=WORKS.find(x=>x.id===state.view);if(!w)return;
  $("d-season").textContent=w.intro?"上下にスライドすると朗読の文字が出ます。":w.season+"の朗読";
  $("d-title").textContent=w.title;
  $("d-len").textContent="本文 約"+w.text.join("").length+"字・朗読 "+(PAGE_AUDIO[w.id]?fmt(PAGE_AUDIO[w.id]):"約"+minutes(w)+"分");
  const body=$("d-body");body.textContent="";w.text.forEach(p=>{const e=document.createElement("p");e.textContent=p;body.appendChild(e)});
  const has=!!state.urls[w.id];
  const playing=state.cur===w.id&&!audio.paused;
  $("d-play").textContent=has?(playing?"一時停止":"この朗読を聞く"):"音声はまだありません";
  $("d-play").disabled=!has;
  $("d-pick-wrap").hidden=state.src[w.id]==="page";
  $("d-pick-label").textContent=has?"MP3を入れかえる":"MP3を入れる";
  $("d-del").hidden=state.src[w.id]!=="device";
  $("d-confirm").hidden=true;
  $("d-note").textContent=state.src[w.id]==="page"?"この音声はページに組みこまれています。だれが開いても聞けます。"
    :has?"この音声はこの端末だけに保存されています。"
    :"スマートフォンに入っているMP3を選ぶと、この端末で聞けるようになります。";
  document.documentElement.style.setProperty("--fs",state.fs+"px");
  {const i=WORKS.findIndex(x=>x.id===state.view),nx=WORKS[i+1];$("next2").hidden=!nx;if(nx)$("next2").textContent=(nx.intro?"":"次へ　")+nx.title+" ›";}
}

function route(){
  const id=location.hash.slice(1);const w=WORKS.find(x=>x.id===id);
  if(w){state.view=id;$("home").hidden=true;$("detail").hidden=false;renderDetail();window.scrollTo(0,0);buildDetailCover();sizeDetailCover();}
  else{state.view=null;$("home").hidden=false;$("detail").hidden=true;renderList();}
}

/* --- 再生 --- */
function load(id,autoplay){
  const w=WORKS.find(x=>x.id===id);if(!w||!state.urls[id])return false;
  stopTts();
  if(state.cur!==id){state.cur=id;audio.src=state.urls[id];}
  audio.playbackRate=state.rate;
  $("p-title").textContent=w.title;
  if(autoplay)audio.play().catch(()=>toast("再生できませんでした。もう一度押してください"));
  return true;
}
function step(dir){
  if(!state.cur){const f=WORKS.find(w=>state.urls[w.id]);if(f)load(f.id,true);else toast("音声が入っている朗読がありません");return;}
  let i=WORKS.findIndex(w=>w.id===state.cur);
  for(let k=0;k<WORKS.length;k++){i+=dir;if(i<0||i>=WORKS.length)break;if(state.urls[WORKS[i].id]){load(WORKS[i].id,true);if(state.view)location.hash=WORKS[i].id;return;}}
  toast(dir>0?"これが最後の朗読です":"これが最初の朗読です");
}
const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
function sync(){
  $("pp-ic").innerHTML=audio.paused?PLAY:PAUSE;$("pp").setAttribute("aria-label",audio.paused?"再生":"一時停止");
  if(state.view)renderDetail();else renderList();
}
audio.addEventListener("play",sync);audio.addEventListener("pause",sync);
audio.addEventListener("timeupdate",()=>{const d=audio.duration||0;if(!seeking)$("seek").value=d?audio.currentTime/d*100:0;$("time").textContent=fmt(audio.currentTime)+" / "+fmt(d);});
audio.addEventListener("loadedmetadata",()=>{$("time").textContent="0:00 / "+fmt(audio.duration)});
audio.addEventListener("ended",()=>{
  if(SLEEP[sleepIdx]===-1){resetSleep();toast("おやすみなさい");sync();return;}
  if(state.cont)step(1);else sync();});

/* --- おやすみタイマー --- */
const SLEEP=[0,15,20,30,-1];   // 分。-1は「この朗読が終わったら」
let sleepIdx=0,deadline=null,fading=null;
function resetSleep(){sleepIdx=0;deadline=null;showSleep();}
function showSleep(){
  const b=$("sleep"),m=SLEEP[sleepIdx];
  b.setAttribute("aria-pressed",m!==0);
  if(m===0)b.textContent="☾ タイマー";
  else if(m===-1)b.textContent="☾ この篇まで";
  else{const r=Math.max(0,deadline-Date.now())/1000;b.textContent="☾ 残り"+fmt(r);}
}
function checkSleep(){
  if(!deadline||fading)return;
  if(Date.now()>=deadline){
    if(audio.paused){resetSleep();return;}
    let v=1;fading=setInterval(()=>{           // 約10秒かけて小さくしてから止める
      v-=0.05;try{audio.volume=Math.max(0,v)}catch(e){}
      if(v<=0){clearInterval(fading);fading=null;audio.pause();try{audio.volume=1}catch(e){}resetSleep();toast("おやすみなさい");}
    },500);
  }
}
$("sleep").onclick=()=>{
  if(fading){clearInterval(fading);fading=null;try{audio.volume=1}catch(e){}}
  sleepIdx=(sleepIdx+1)%SLEEP.length;const m=SLEEP[sleepIdx];
  deadline=m>0?Date.now()+m*60000:null;showSleep();
  toast(m===0?"タイマーを切りました":m===-1?"いまの朗読が終わったら止めます":m+"分後にゆっくり止めます");
};
audio.addEventListener("timeupdate",checkSleep);
setInterval(()=>{if(deadline)showSleep();checkSleep();},1000);
let seeking=false;
$("seek").addEventListener("input",()=>{seeking=true;const d=audio.duration||0;$("time").textContent=fmt($("seek").value/100*d)+" / "+fmt(d);});
$("seek").addEventListener("change",()=>{const d=audio.duration||0;if(d)audio.currentTime=$("seek").value/100*d;seeking=false;});
$("pp").onclick=()=>{if(!state.cur){step(1);return;}audio.paused?audio.play().catch(()=>{}):audio.pause();};
$("rew").onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-15)};
$("fwd").onclick=()=>{if(audio.duration)audio.currentTime=Math.min(audio.duration-0.5,audio.currentTime+15)};
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
function showRate(){$("rate").textContent=state.rate.toFixed(state.rate===1.25?2:1)+"倍";$("cont").textContent="連続";$("cont").setAttribute("aria-pressed",state.cont);}
$("rate").onclick=()=>{state.rate=RATES[(RATES.indexOf(state.rate)+1)%RATES.length];audio.playbackRate=state.rate;showRate();savePrefs();};
$("cont").onclick=()=>{state.cont=!state.cont;showRate();savePrefs();toast(state.cont?"終わったら次の朗読へ進みます":"一篇ずつ止まります");};

/* --- 詳細画面の操作 --- */
$("back").onclick=()=>{location.hash="";};
$("back2").onclick=()=>{location.hash="";};
$("next2").onclick=()=>{const i=WORKS.findIndex(x=>x.id===state.view);if(WORKS[i+1])location.hash=WORKS[i+1].id;};
$("d-play").onclick=()=>{const id=state.view;if(state.cur===id&&!audio.paused){audio.pause();return;}load(id,true);};
$("d-pick").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;const id=state.view;
  if(!/audio|mpeg/.test(f.type)&&!/\.mp3$/i.test(f.name)){toast("音声ファイル（MP3）を選んでください");return;}
  try{await idbPut(id,f);}catch(err){toast("この端末には保存できませんでした。このまま一時的に再生できます");}
  if(state.urls[id]&&state.src[id]==="device")URL.revokeObjectURL(state.urls[id]);
  state.urls[id]=URL.createObjectURL(f);state.src[id]="device";
  if(state.cur===id){state.cur=null;}
  renderDetail();toast("「"+WORKS.find(w=>w.id===id).title+"」に音声を入れました");
});
$("d-del").onclick=()=>{$("d-confirm").hidden=false;};
$("d-del-no").onclick=()=>{$("d-confirm").hidden=true;};
$("d-del-yes").onclick=async()=>{
  const id=state.view;try{await idbDel(id)}catch(e){}
  if(state.cur===id){audio.pause();audio.removeAttribute("src");state.cur=null;$("p-title").textContent="再生する朗読を選んでください";}
  URL.revokeObjectURL(state.urls[id]);delete state.urls[id];delete state.src[id];renderDetail();toast("音声を外しました");
};
$("fs-up").onclick=()=>{state.fs=Math.min(26,state.fs+2);renderDetail();savePrefs();};
$("fs-down").onclick=()=>{state.fs=Math.max(15,state.fs-2);renderDetail();savePrefs();};

/* --- 合成音声の試し読み（使える環境でのみ表示） --- */
let tts=null,ttsOn=false;
function stopTts(){if(tts&&ttsOn){try{tts.stop()}catch(e){}}}
(async()=>{try{tts=window.claude?.use?await window.claude.use("tts"):null;}catch(e){tts=null}
  if(!tts)return;$("d-tts").hidden=false;
  tts.onState(({state:s})=>{ttsOn=s==="speaking"||s==="paused";$("d-tts").textContent=ttsOn?"試し読みを止める":"試し読み（合成音声）";});
})();
$("d-tts").onclick=()=>{
  if(!tts)return;if(ttsOn){tts.stop();return;}
  audio.pause();const w=WORKS.find(x=>x.id===state.view);
  tts.speak([{text:w.title,language:"ja",rate:0.9},...w.text.map(p=>({text:p,language:"ja",rate:0.9}))]).catch(e=>{if(e&&e.code==="not_granted"){$("d-tts").hidden=true;}});
};


/* --- 本文ページの絵 --- */
let dcFull=0;
function buildDetailCover(){
  const box=$("d-cover");if(box.firstChild)return;
  const src=document.querySelector(".cover svg");if(!src)return;
  let html=src.outerHTML.replace(/id="([^"]+)"/g,'id="d-$1"').replace(/url\(#([^)]+)\)/g,"url(#d-$1)");
  box.innerHTML=html;
  const svg=box.querySelector("svg");svg.setAttribute("preserveAspectRatio","xMidYMid slice");svg.removeAttribute("aria-label");svg.setAttribute("aria-hidden","true");
}
function sizeDetailCover(){
  if($("detail").hidden)return;
  const box=$("d-cover"),w=box.parentElement.clientWidth;
  dcFull=Math.min(w*480/400,window.innerHeight*0.78);
  const min=Math.min(dcFull,w*0.61);   // スライドしたときに残す絵の高さ（横幅の約6割）
  const start=$("back").offsetTop+$("back").offsetHeight;   // 絵の本来の位置（貼りついても変わらない基準）
  const h=Math.max(min,dcFull-Math.max(0,window.scrollY-start));
  box.style.height=h+"px";box.style.marginBottom=(dcFull-h)+"px";
}
window.addEventListener("scroll",()=>requestAnimationFrame(sizeDetailCover),{passive:true});
window.addEventListener("resize",sizeDetailCover);
window.addEventListener("hashchange",route);
showRate();route();
Promise.all(WORKS.map(probe)).then(route);
</script>
